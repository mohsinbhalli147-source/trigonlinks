name: Deploy Backend to Hostinger
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      ftp_server:
        description: 'FTP Server'
        required: true
        default: 'ftp.lightgreen-rhinoceros-358548.hostingersite.com'
      ftp_username:
        description: 'FTP Username'
        required: true
      ftp_password:
        description: 'FTP Password'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json package-lock.json deploy-package/
          cp -r migrations deploy-package/ 2>/dev/null || true
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ github.event.inputs.ftp_server || secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ github.event.inputs.ftp_username || secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ github.event.inputs.ftp_password || secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: backend/deploy-package/
          server-dir: /public_html/
          security: strict
          exclude: |
            **/node_modules/**
            **/.git/**
            **/src/**
            **/test/**
